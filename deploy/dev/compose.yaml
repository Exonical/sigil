services:
  postgres:
    image: docker.io/library/postgres:17.6
    environment:
      POSTGRES_DB: sigil
      POSTGRES_USER: sigil
      POSTGRES_PASSWORD: sigil-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigil -d sigil"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - sigil-postgres-data:/var/lib/postgresql/data

volumes:
  sigil-postgres-data:
