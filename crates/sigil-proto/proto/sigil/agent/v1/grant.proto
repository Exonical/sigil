syntax = "proto3";

package sigil.agent.v1;

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  FIDO_FINGERPRINT_ENROLL = 1;
  FIDO_FINGERPRINT_REMOVE = 2;
}

message OperationGrant {
  uint32 version = 1;
  string grant_id = 2;
  Operation operation = 3;
  string subject = 4;
  string station_id = 5;
  string token_serial = 6;
  string caller_os_user = 7;
  int64 not_before_unix = 8;
  int64 expires_at_unix = 9;
  string fingerprint_id = 10;
}

message SignedGrant {
  bytes grant = 1;
  bytes signature = 2;
  string key_id = 3;
}
