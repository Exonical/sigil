[package]
name = "sigil-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sigil-gui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "lib", "launch"] }
sigil-app = { path = "../sigil-app" }
sigil-core = { path = "../sigil-core" }
sigil-mock = { path = "../sigil-mock" }
sigil-platform = { path = "../sigil-platform" }
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
