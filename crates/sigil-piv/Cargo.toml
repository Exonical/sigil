[package]
name = "sigil-piv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.8.4"
const-oid = "0.10.2"
der = { version = "0.8.2", features = ["pem"] }
flate2 = "1.1.10"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
pkcs1 = "0.7.5"
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
getrandom = "0.4"
sha2 = "0.11.0"
sigil-core = { path = "../sigil-core" }
zeroize = "1.9.0"
x509-cert = "0.3.0"
