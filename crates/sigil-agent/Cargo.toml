[package]
name = "sigil-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sigil-agent"
path = "src/main.rs"

[features]
default = []
dev-grants = []
test-support = []

[dependencies]
sigil-core = { path = "../sigil-core" }
sigil-app = { path = "../sigil-app" }
sigil-platform = { path = "../sigil-platform" }
sigil-mock = { path = "../sigil-mock" }
sigil-proto = { path = "../sigil-proto" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tonic = { version = "0.14.6", features = ["tls-ring", "transport"] }
prost = "0.14.4"

p256 = { version = "0.14.0", features = ["ecdsa", "pem"] }
zeroize = "1.9.0"
toml = "1.1.6"
futures-util = "0.3.34"
libc = "0.2.189"
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7.1"
async-trait = "0.1.89"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
sigil-client = { path = "../sigil-client" }
rcgen = { version = "=0.13.2", features = ["pem", "x509-parser"] }
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
rustls-cng = { version = "0.7.1", default-features = false, features = ["ring"] }
sha1 = "0.10.7"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_SystemServices"] }
