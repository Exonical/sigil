[package]
name = "sigil-yubikey"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
const-oid = "0.10.2"
sigil-core = { path = "../sigil-core" }
sigil-piv = { path = "../sigil-piv" }
tracing.workspace = true
getrandom = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha2_legacy = { package = "sha2", version = "0.10.9" }
sha2 = "0.11.0"
x509-cert = "0.3.0"
zeroize = "1.9.0"

[dev-dependencies]
x509-cert = { version = "0.3.0", features = ["builder"] }
