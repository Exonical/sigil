[workspace]
resolver = "2"
members = [
    "crates/sigil-core",
    "crates/sigil-app",
    "crates/sigil-mock",
    "crates/sigil-platform",
    "crates/sigil-yubikey",
    "crates/sigil-cli",
    "crates/sigil-gui",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

